name: CI Pipeline (Optimized)

on:
  push:
  # Triggers any branch
  workflow_dispatch:

jobs:
  # TEST STAGE - Using tox like older GitLab version
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Display Python version
        run: python -V

      - name: Install tox and run tests
        run: |
          python -m pip install --upgrade pip
          pip install tox
          TOXENV=py$(echo ${{ matrix.python-version }} | tr -d '.')
          tox -r -e $TOXENV

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-py${{ matrix.python-version }}
          path: report/py*/report.xml
          retention-days: 30

      - name: Upload coverage results (Cobertura XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage/py*/coverage.xml
          retention-days: 30

      - name: Extract and display coverage
        if: always()
        run: |
          TOXENV=py$(echo ${{ matrix.python-version }} | tr -d '.')
          if [ -f "coverage/$TOXENV/coverage.xml" ]; then
            # Extract coverage percentage from Cobertura XML or coverage.txt
            if command -v coverage &> /dev/null; then
              coverage report || echo "Coverage report not available"
            fi
          fi

  formatting-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Check code formatting with black
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
          black --check src/ tests/

  # BUILD STAGE
  build-and-publish:
    runs-on: ubuntu-latest
    needs: [test, formatting-check]
    # Only run on push to main/master when pyproject.toml changes
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          
      - name: Check if pyproject.toml changed
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: pyproject.toml

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Build package
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .[build]
          python -m build

      - name: Publish to PyPI
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload dist/*

      - name: Upload build artifacts
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/
          retention-days: 90

      - name: Create GitHub Release 
        if: steps.changed-files.outputs.any_changed == 'true' && success()
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          tag_name: v${{ github.run_number }}
          body: |
            Automated release from CI
            Published to PyPI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
