image: python:latest

stages:
    - test
    - build

.test: &test
  stage: test
  script:
    - pip install tox
    - tox -r -e $TOXENV
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report/$TOXENV/report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/$TOXENV/coverage.xml

test-py310:
  image: python:3.10
  <<: *test
  variables:
    TOXENV: py310  

test-py311:
  image: python:3.11
  <<: *test
  variables:
    TOXENV: py311

formatting-check:
    stage: test
    script:
      - pip install black
      - black --check .

build-3.10:
    image: python:3.10
    stage: build
    needs:
        - test-py310
    script:
        - pip install build twine
        - python -m build
        - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*

    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes:
              - pyproject.toml
        - if: $CI_PIPELINE_SOURCE == "tags"
